# run_exp_meme.sh — MEME 4-Phase 对齐实验配置
#
# 与 run_exp.config.yaml 的区别:
#   - 使用 pipeline_meme_4phase.py 替代 ingest_candidates + fuse + pipeline_generate
#   - 每个 method 只调一次 4phase 脚本，内部按 per-episode 四阶段执行
#   - relation_decision 额外有 fuse 步骤（phase 脚本内部处理）
#   - Judge 使用 pipeline_meme_evaluate.py（task-specific prompts + trivial-pass）
#   - 实验输出目录带 _meme4p 后缀

parallel:
  extract_candidates_chunk_concurrency: 100
  # 4phase ingest 并发（每 method 各自的 parallel_episodes 参数，对应 per-episode 并发）
  # relation_decision 由于包含 LLM 融合步骤，建议 1
  meme_4phase_parallel_episodes_relation_decision: 20
  meme_4phase_parallel_episodes_mem0: 4
  meme_4phase_parallel_episodes_add_all: 20
  meme_4phase_parallel_episodes_zep: 10
  meme_4phase_parallel_episodes_amac: 10
  meme_4phase_parallel_episodes_evermemos: 4
  evermemos_cluster_concurrency: 8
  meme_4phase_answer_concurrency: 10
  # fusion（per-episode 内 package 级并发）
  fuse_package_concurrency: 4
  evaluate_meme_judge_max_concurrency: 8

token_limits:
  tok_extract_candidates_max_new_tokens: 2048
  tok_ingest_candidates_relation_max_new_tokens: 256
  tok_ingest_candidates_manager_max_new_tokens: 2048
  tok_fuse_max_new_tokens: 512
  tok_memory_token_limit: 512
  tok_evaluate_meme_judge_max_new_tokens: 512

debug:
  evaluate_llm_judge_print_one_sample: 0

prompts:
  # --- extract_candidates ---
  mem_extract_template: "0_mem_extract_v2.jinja"
  mem_extract_aspects_only: "1"
  mem_extract_aspect_template_1: "0_mem_extract_aspect_events_en.jinja"
  mem_extract_aspect_template_2: "0_mem_extract_aspect_preferences_en.jinja"
  mem_extract_aspect_template_3: "0_mem_extract_aspect_social_en.jinja"
  # --- relation_decision ingest ---
  relation_classification_system_en: "lme_relation_classification_system_en_v2.jinja"
  relation_classification_system_zh: "lme_relation_classification_system_zh_v2.jinja"
  relation_classification_user: "lme_relation_classification_user.jinja"
  # --- relation_decision fusion ---
  fusion_bundle_template_en: "lme_fuse_memory_bundle_en_v3.jinja"
  fusion_bundle_template_zh: ""
  fusion_edge_labels_template_en: "lme_fuse_memory_bundle_edge_labels_en_v2.jinja"
  fusion_edge_labels_template_zh: "lme_fuse_memory_bundle_edge_labels_zh_v2.jinja"

paths:
  dir_memdb_extract_candidates: "MemDB/candidates/${benchmark}_${extract_model}_${candidate_suffix}"
  dir_memdb_ingest_run_root: "MemDB/ingest/${benchmark}_cand${candidate_suffix}_${manager_model}_${exp_suffix}"
  # 4-phase DBs (episodes stored as {hn}_before / {hn}_after)
  dir_memdb_4phase_relation_decision: "${dir_memdb_ingest_run_root}/relation_decision_4p"
  dir_memdb_4phase_relation_decision_fused: "${dir_memdb_ingest_run_root}/relation_decision_4p_fused"
  dir_memdb_4phase_mem0: "${dir_memdb_ingest_run_root}/mem0_4p"
  dir_memdb_4phase_add_all: "${dir_memdb_ingest_run_root}/add_all_4p"
  dir_memdb_4phase_zep: "${dir_memdb_ingest_run_root}/zep_4p"
  dir_memdb_4phase_amac: "${dir_memdb_ingest_run_root}/amac_4p"
  dir_memdb_4phase_evermemos: "${dir_memdb_ingest_run_root}/evermemos_4p"
  # trace
  dir_logs_memory_trace_run_root: "logs/memory_trace/${benchmark}_cand${candidate_suffix}_${manager_model}_${exp_suffix}_meme4p"
  dir_logs_memory_trace_relation_decision: "${dir_logs_memory_trace_run_root}/relation_decision"
  dir_logs_memory_trace_mem0: "${dir_logs_memory_trace_run_root}/mem0"
  dir_logs_memory_trace_add_all: "${dir_logs_memory_trace_run_root}/add_all"
  dir_logs_memory_trace_zep: "${dir_logs_memory_trace_run_root}/zep"
  dir_logs_memory_trace_amac: "${dir_logs_memory_trace_run_root}/amac"
  dir_logs_memory_trace_evermemos: "${dir_logs_memory_trace_run_root}/evermemos"
  # experiment output
  dir_experiment_run_root: "experiment/${benchmark}_cand${candidate_suffix}_${manager_model}_${answer_model}_tl${tok_memory_token_limit}_${exp_suffix}_meme4p"
  viewer_run_tag: "${benchmark}_cand${candidate_suffix}_${manager_model}_${answer_model}_tl${tok_memory_token_limit}_${exp_suffix}_meme4p"
  file_experiment_pred_relation_decision_jsonl: "${dir_experiment_run_root}/pred_relation_decision.jsonl"
  file_experiment_pred_mem0_jsonl: "${dir_experiment_run_root}/pred_mem0.jsonl"
  file_experiment_pred_add_all_jsonl: "${dir_experiment_run_root}/pred_add_all.jsonl"
  file_experiment_pred_zep_jsonl: "${dir_experiment_run_root}/pred_zep.jsonl"
  file_experiment_pred_amac_jsonl: "${dir_experiment_run_root}/pred_amac.jsonl"
  file_experiment_pred_evermemos_jsonl: "${dir_experiment_run_root}/pred_evermemos.jsonl"
