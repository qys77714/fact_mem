# fact_memory LME 实验配置
# 修改此文件来调整实验参数；比较多种方法时只需切换 methods 下各方法的 enabled 即可。
# 用法：python run_exp_lme.py [--config config/lme.yaml] [--stages extract,ingest,generate,evaluate]

experiment:
  benchmark: lme_s        # lme_o / lme_s / lme_m / meme_filler32k / meme_nofiller / ...
  suffix: exp002          # 实验版本标签（区分同一 benchmark 的多次运行）

models:
  extract: gemma4-26B               # 候选记忆抽取 LLM
  manager: gemma4-26B               # 灌库管理 LLM（relation_decision / mem0 / zep / amac / evermemos）
  answer: gemma4-26B                # 答题 LLM
  judge: qwen3-max                  # LLM Judge
  embedding: qwen3-embedding-0.6b     # Embedding 模型

extract:
  candidate_suffix: 0615_unified  # 候选版本标签（改抽取策略时同步更改，避免沿用旧 state 跳过 episode）
  granularity: 4              # 每 N turn 一个 chunk（"all" = 整个 session 一个 chunk）
  turn_overlap: 0             # 相邻 chunk 共享 turn 数（须小于 granularity）
  language: en                # 提示语言：en / zh（改语言时同步换下方 _zh 版本模板）
  aspect_templates:           # 单 pass 统一抽取（与 MEME 对齐：events+preferences+social 合并，含 user 中心显著性过滤）
    - "0_mem_extract_aspect_unified_en.jinja"

methods:
  # 在此控制运行哪些灌库方法；方法特定超参在各子节设置。
  # 比较实验：将多个 enabled 设为 true，run_exp_lme.py 会依次完成各方法的 ingest 和 generate。

  add_all:
    enabled: true

  amac:
    enabled: false
    threshold: 0.55                    # A-MAC 准入阈值（≥threshold 则写入）
    weights: "0.1,0.1,0.1,0.1,0.6"    # U,C,N,R,T 五维权重（自动归一化）
    skip_utility: false
    recency_decay_per_step: 0.12
    novelty_max_existing: 64

  zep:
    enabled: false

  relation_decision:
    enabled: true
    related_top_k: 3
    fusion_model: ""
    cascade_enabled: false
    deletion_enabled: false
    topic_aggregation_enabled: false
    condition_sim_threshold: 0.5
    pairwise_sim_threshold: 0.5

  mem0:
    enabled: false
    related_top_k: 3
    related_aggregate_max: 10

  evermemos:
    enabled: false
    similarity_threshold: 0.65
    max_time_gap_days: 7.0

generate:
  retrieve_topk: 50                  # 召回记忆条数
  memory_token_limit: 512            # 传入 Agent 的记忆 token 上限
  answer_stratified_sample: 500      # 分层抽样题数（0 = 全量；MEME 自动设为 0）
  answer_sample_seed: 43
  show_memory_time: true             # true = 召回记忆展示时间戳

  hybrid:                            # BM25 + dense 混合检索
    enabled: true
    dense_weight: 0.8
    bm25_weight: 0.2
    pool_mult: 4                     # 每路候选数 = max(retrieve_topk * pool_mult, 50)

evaluate:
  use_cot: true
  judge_stratified_sample: 0         # 对 Judge 额外分层抽样（0 = 与答题保持一致）
  judge_sample_seed: 43

parallel:
  extract_chunk_concurrency: 100
  ingest_relation_concurrency: 50    # relation_decision：单 episode 内并发比较的 relation pair 数
  ingest_episode_concurrency:        # 各方法 episode 间并发
    relation_decision: 100
    mem0: 50
    add_all: 100
    zep: 50
    amac: 100
    evermemos: 5
    fusion_episodes: 100             # relation_decision 专用：关系包融合 episode 并发
    fusion_packages: 10              # relation_decision 专用：关系包融合 package 并发
  generate_parallel_episodes: 100
  generate_answer_concurrency: 2
  evaluate_max_concurrency: 8

token_limits:
  extract_max_new_tokens: 2048
  ingest_relation_max_new_tokens: 256
  ingest_manager_max_new_tokens: 2048
  fusion_max_new_tokens: 512
  evaluate_max_new_tokens: 512

debug:
  evaluate_print_one_sample: false

prompts:
  # 所有文件均位于 src/prompts/templates/；空字符串 = 由代码内置默认处理
  # --- ingest relation_decision ---
  relation_system_en: "lme_relation_classification_system_en_v2.jinja"
  relation_system_zh: "lme_relation_classification_system_zh_v2.jinja"
  relation_user: "lme_relation_classification_user.jinja"
  # --- fuse（relation_decision 专用）---
  fusion_bundle_en: "fuse_memory_bundle_en_v3.jinja"
  fusion_bundle_zh: ""
  fusion_edge_labels_en: "fuse_memory_bundle_edge_labels_en_v2.jinja"
  fusion_edge_labels_zh: "fuse_memory_bundle_edge_labels_zh_v2.jinja"
  # --- pipeline_lme_evaluate Judge ---
  judge_oqa: "pipeline_eval_oqa.jinja"
  judge_mcq: "pipeline_eval_mcq.jinja"
  judge_system: "pipeline_eval_system.jinja"
