[project]
name = "easy-mem"
version = "0.1.0"
description = "Unified benchmark pipeline for comparing long-context memory methods (RAG, LME candidate ingest, etc.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "pydantic>=2.9.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.1.1",
    "transformers>=5.5.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "tqdm>=4.0.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "graphiti-core[kuzu]>=0.29.0",
    "kuzu>=0.11.3",
    "rouge-score>=0.1.2",
    "vllm==0.19.1",
    "openpyxl>=3.1.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
# torch cu126 轮子：默认源装到 cu13 与本机驱动 CUDA 12.8 不兼容，固定走此 index
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
