# run_exp.sh：并行、Token、调试、Jinja 模板名、输出路径（实验超参在 run_exp.sh 顶部改）
#
# 载入方式（任选其一）：
#   ./script/run_exp.sh
#   RUN_EXP_CONFIG=/path/to/custom.yaml ./script/run_exp.sh
#   ./script/run_exp.sh --config /path/to/custom.yaml
#
# paths 中的 ${...} 在载入时展开；可用变量来自 shell 导出：
#   benchmark, extract_model, candidate_suffix, manager_model, answer_model, exp_suffix
# 以及本文件 parallel / token_limits / debug / prompts 中的键（如 tok_generate_lme_prebuilt_memory_token_limit）。
#
# prompts：未写全的键会与 run_exp_load_config.py 内建默认合并。
# 空字符串表示「不向对应 CLI 传该参数，由步骤脚本内置默认处理」
# （如 mem_extract_template 置空则不传 --mem-extract-template；fusion_bundle_template_zh 置空则用代码内默认 zh 模板名）。
#
# --- 记忆抽取（见 prompts）：mem_extract_aspects_only=0 → 仅主模板；=1 → 仅三方面模板（须填满 mem_extract_aspect_template_*）。
# 设为 1 时整条 run_exp.sh 候选阶段均为三方面事实抽取；run_exp.sh 顶部 apply_language 须与 *_en / *_zh 模板一致。
# 主模板默认解析表（mem_extract_template 为空且未传 CLI 时）：
# | benchmark 族 | language en | language zh |
# | 非 locomo    | 0_mem_extract_v2.jinja      | 0_mem_extract_v2_zh.jinja      |
# | locomo*      | 0_mem_extract_locomo.jinja  | 0_mem_extract_locomo_zh.jinja  |
#
# --- 仓库内其它 Jinja（当前 run_exp 未接 CLI，仅作文档）---
# lme_prebuilt_router_user_{en,zh}.jinja、amem_*.jinja 等见 src/prompts/templates/

parallel:
  extract_candidates_chunk_concurrency: 100
  ingest_candidates_relation_concurrency: 50
  ingest_relation_decision_episode_concurrency: 20
  ingest_mem0_episode_concurrency: 50
  ingest_add_all_episode_concurrency: 100
  ingest_zep_episode_concurrency: 8
  ingest_amac_episode_concurrency: 20
  ingest_evermemos_episode_concurrency: 1
  fuse_relation_decision_fused_episode_concurrency: 30
  fuse_relation_decision_fused_package_concurrency: 20
  generate_lme_prebuilt_parallel_episodes: 100
  generate_lme_prebuilt_answer_concurrency: 2
  evaluate_llm_judge_max_concurrency: 5

token_limits:
  tok_extract_candidates_max_new_tokens: 2048
  tok_ingest_candidates_relation_max_new_tokens: 256
  tok_ingest_candidates_manager_max_new_tokens: 2048
  tok_fuse_relation_decision_fused_max_new_tokens: 512
  tok_generate_lme_prebuilt_memory_token_limit: 512
  tok_evaluate_llm_judge_max_new_tokens: 2048

debug:
  evaluate_llm_judge_print_one_sample: 1

# 全流水线相关的 Jinja 文件名（位于 src/prompts/templates/）；与 run_exp_load_config.py 默认合并
prompts:
  # --- extract_candidates（当前示例：LoCoMo + 三方面抽取）---
  # mem_extract_aspects_only=1：仅用三方面模板；主模板文件名写入 episode 元数据但不参与 LLM。
  # apply_language=zh 时请改用 0_mem_extract_locomo_zh.jinja 与 *_locomo_zh.jinja。
  mem_extract_template: "0_mem_extract_v2.jinja"
  mem_extract_aspects_only: "1"
  mem_extract_aspect_template_1: "0_mem_extract_aspect_events_en.jinja"
  mem_extract_aspect_template_2: "0_mem_extract_aspect_preferences_en.jinja"
  mem_extract_aspect_template_3: "0_mem_extract_aspect_social_en.jinja"
  # --- ingest relation_decision：成对五类关系（非空才覆盖代码内默认文件名）---
  relation_classification_system_en: "lme_relation_classification_system_en_v2.jinja"
  relation_classification_system_zh: "lme_relation_classification_system_zh_v2.jinja"
  relation_classification_user: "lme_relation_classification_user.jinja"
  # --- fuse_lme_memory_bundles：关系包 user + 包内行前缀边标签（zh bundle 空 = 不传，由脚本默认）---
  fusion_bundle_template_en: "lme_fuse_memory_bundle_en_v3.jinja"
  fusion_bundle_template_zh: ""
  fusion_edge_labels_template_en: "lme_fuse_memory_bundle_edge_labels_en_v2.jinja"
  fusion_edge_labels_template_zh: "lme_fuse_memory_bundle_edge_labels_zh_v2.jinja"
  # --- pipeline_evaluate：LLM Judge（某键空 = 不传，用 pipeline_evaluate 内置 default）---
  judge_oqa_template: "pipeline_eval_oqa.jinja"
  judge_mcq_template: "pipeline_eval_mcq.jinja"
  judge_system_template: "pipeline_eval_system.jinja"
  # --- pipeline_generate / agent + LME 检索上下文（run_exp 不传 CLI，仅单一配置源；改代码侧模板时请同步）---
  generate_agent_prompt_mcq_en: "agent_prompt_en_mcq.jinja"
  generate_agent_prompt_mcq_zh: "agent_prompt_zh_mcq.jinja"
  generate_agent_prompt_open_en: "agent_prompt_en_open.jinja"
  generate_agent_prompt_open_zh: "agent_prompt_zh_open.jinja"
  generate_context_empty_en: "agent_context_empty_en.jinja"
  generate_context_empty_zh: "agent_context_empty_zh.jinja"
  generate_context_unit_en: "lme_memory_context_unit_en.jinja"
  generate_context_unit_zh: "lme_memory_context_unit_zh.jinja"
  # --- memory.base：非 LME 子类 format_retrieved_for_context 的 unit 行（与上列 LME unit 不同）---
  base_memory_context_unit_en: "agent_context_unit_en.jinja"
  base_memory_context_unit_zh: "agent_context_unit_zh.jinja"
  # --- mem0 管线（memory.mem0；ingest --update-method mem0；run_exp 默认未启用该分支）---
  mem0_fact_retrieval_en: "mem0_fact_retrieval_en.jinja"
  mem0_fact_retrieval_zh: "mem0_fact_retrieval_zh.jinja"
  mem0_fact_retrieval_multi_en: "mem0_fact_retrieval_multi_en.jinja"
  mem0_fact_retrieval_multi_zh: "mem0_fact_retrieval_multi_zh.jinja"
  mem0_current_memory_part_en: "mem0_current_memory_part_en.jinja"
  mem0_current_memory_part_zh: "mem0_current_memory_part_zh.jinja"
  mem0_current_memory_empty_en: "mem0_current_memory_empty_en.jinja"
  mem0_current_memory_empty_zh: "mem0_current_memory_empty_zh.jinja"
  mem0_update_memory_default_en: "mem0_update_memory_default_en.jinja"
  mem0_update_memory_default_zh: "mem0_update_memory_default_zh.jinja"
  mem0_update_memory_no_delete_en: "mem0_update_memory_no_delete_en.jinja"
  mem0_update_memory_no_delete_zh: "mem0_update_memory_no_delete_zh.jinja"
  mem0_context_unit_en: "mem0_context_unit_en.jinja"
  mem0_context_unit_zh: "mem0_context_unit_zh.jinja"

paths:
  dir_memdb_extract_candidates: "MemDB/candidates/${benchmark}_${extract_model}_${candidate_suffix}"
  # 灌库根（无 answer_model / tl）；与 viewer_run_tag、experiment 不同，fusion 对照页须用此处路径而非 viewer_run_tag
  dir_memdb_ingest_run_root: "MemDB/ingest/${benchmark}_cand${candidate_suffix}_${manager_model}_${exp_suffix}"
  dir_memdb_ingest_relation_decision: "${dir_memdb_ingest_run_root}/relation_decision"
  dir_memdb_ingest_relation_decision_fused: "${dir_memdb_ingest_run_root}/relation_decision_fused"
  dir_memdb_ingest_mem0: "${dir_memdb_ingest_run_root}/mem0"
  dir_memdb_ingest_add_all: "${dir_memdb_ingest_run_root}/add_all"
  dir_memdb_ingest_zep: "${dir_memdb_ingest_run_root}/zep"
  dir_memdb_ingest_amac: "${dir_memdb_ingest_run_root}/amac"
  dir_memdb_ingest_evermemos: "${dir_memdb_ingest_run_root}/evermemos"
  dir_logs_memory_trace_run_root: "logs/memory_trace/${benchmark}_cand${candidate_suffix}_${manager_model}_tl${tok_generate_lme_prebuilt_memory_token_limit}_${exp_suffix}"
  dir_logs_memory_trace_relation_decision: "${dir_logs_memory_trace_run_root}/relation_decision"
  dir_logs_memory_trace_mem0: "${dir_logs_memory_trace_run_root}/mem0"
  dir_logs_memory_trace_add_all: "${dir_logs_memory_trace_run_root}/add_all"
  dir_logs_memory_trace_zep: "${dir_logs_memory_trace_run_root}/zep"
  dir_logs_memory_trace_amac: "${dir_logs_memory_trace_run_root}/amac"
  dir_logs_memory_trace_evermemos: "${dir_logs_memory_trace_run_root}/evermemos"
  dir_logs_agent_trace_run_root: "logs/agent_trace/${benchmark}_cand${candidate_suffix}_${manager_model}_${answer_model}_tl${tok_generate_lme_prebuilt_memory_token_limit}_${exp_suffix}"
  dir_logs_agent_trace_relation_decision: "${dir_logs_agent_trace_run_root}/relation_decision"
  dir_logs_agent_trace_mem0: "${dir_logs_agent_trace_run_root}/mem0"
  dir_logs_agent_trace_add_all: "${dir_logs_agent_trace_run_root}/add_all"
  dir_logs_agent_trace_zep: "${dir_logs_agent_trace_run_root}/zep"
  dir_logs_agent_trace_amac: "${dir_logs_agent_trace_run_root}/amac"
  dir_logs_agent_trace_evermemos: "${dir_logs_agent_trace_run_root}/evermemos"
  dir_experiment_run_root: "experiment/${benchmark}_cand${candidate_suffix}_${manager_model}_${answer_model}_tl${tok_generate_lme_prebuilt_memory_token_limit}_${exp_suffix}"
  viewer_run_tag: "${benchmark}_cand${candidate_suffix}_${manager_model}_${answer_model}_tl${tok_generate_lme_prebuilt_memory_token_limit}_${exp_suffix}"
  file_experiment_pred_relation_decision_jsonl: "${dir_experiment_run_root}/pred_relation_decision.jsonl"
  file_experiment_pred_mem0_jsonl: "${dir_experiment_run_root}/pred_mem0.jsonl"
  file_experiment_pred_add_all_jsonl: "${dir_experiment_run_root}/pred_add_all.jsonl"
  file_experiment_pred_zep_jsonl: "${dir_experiment_run_root}/pred_zep.jsonl"
  file_experiment_pred_amac_jsonl: "${dir_experiment_run_root}/pred_amac.jsonl"
  file_experiment_pred_evermemos_jsonl: "${dir_experiment_run_root}/pred_evermemos.jsonl"
