experiment:
  benchmark: lme_s
  suffix: adv_v1_filler_N4_tl256
models:
  extract: gemma4-26B
  manager: gemma4-26B
  answer: gemma4-26B
  judge: gpt-4o-mini
  embedding: qwen3-embedding-0.6b
extract:
  candidate_suffix: adv_v1_filler_N4
methods:
  add_all: {enabled: true}
  relation_decision:
    enabled: true
    backend: llm
    related_top_k: 3
    fusion_model: ""
    cascade_enabled: false
    deletion_enabled: false
    condition_sim_threshold: 0.5
    pairwise_sim_threshold: 0.5
  amac: {enabled: false}
  zep: {enabled: false}
  mem0: {enabled: false}
  evermemos: {enabled: false}
generate:
  retrieve_topk: 50
  memory_token_limit: 256
  answer_stratified_sample: 0
  answer_sample_seed: 43
  show_memory_time: true
  hybrid: {enabled: true, dense_weight: 0.8, bm25_weight: 0.2, pool_mult: 4}
evaluate:
  use_cot: true
  judge_stratified_sample: 0
  judge_sample_seed: 43
parallel:
  ingest_relation_concurrency: 50
  ingest_episode_concurrency: {relation_decision: 40, add_all: 100}
  generate_parallel_episodes: 50
  generate_answer_concurrency: 2
  evaluate_max_concurrency: 8
token_limits:
  ingest_relation_max_new_tokens: 256
prompts:
  relation_system_en: "lme_relation_classification_system_en_v3.jinja"
