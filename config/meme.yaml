# fact_memory MEME 4-Phase 实验配置
# 与官方 MEME-public 协议对齐：每个 episode 经历 4 个阶段（before ingest → before Q&A → after ingest → after Q&A）
#
# 用法：
#   python run_exp_meme.py --config config/meme.yaml --stages run,evaluate   # 仅 relation_decision（候选已就绪）
#   python run_exp_meme.py --config config/meme.yaml                         # 含 extract（会重写候选目录）

experiment:
  benchmark: meme_filler32k   # meme_nofiller / meme_filler32k / meme_filler128k
  suffix: "0616_exp004_topic_agg"

models:
  extract: gemma4-26B
  manager: gemma4-26B           # 灌库管理 LLM（relation_decision / mem0 / zep / amac / evermemos）
  answer: gemma4-26B
  judge: qwen3-max
  embedding: qwen3-embedding-0.6b

extract:
  # → MemDB/candidates/meme_filler32k_gemma4-26B_0519_as4（candidate_memories + cas_update_rules）
  candidate_suffix: "0615_unified"
  granularity: 4
  turn_overlap: 0
  language: en
  aspect_templates:
    - "0_mem_extract_aspect_unified_en.jinja"   # 单 pass 统一抽取（events+preferences+social 合并，含显著性过滤，精简记忆量）

methods:
  amac:
    enabled: false
    threshold: 0.45
    weights: "0.1,0.1,0.1,0.1,0.6"
    skip_utility: false
    recency_decay_per_step: 0.12
    novelty_max_existing: 64

  zep:
    enabled: false

  relation_decision:
    enabled: true
    related_top_k: 3
    fusion_model: ""
    cascade_enabled: false
    deletion_enabled: false
    topic_aggregation_enabled: false
    condition_sim_threshold: 0.5
    pairwise_sim_threshold: 0.5

  mem0:
    enabled: false
    related_top_k: 3
    related_aggregate_max: 10

  add_all:
    enabled: true

  evermemos:
    enabled: false
    similarity_threshold: 0.65
    max_time_gap_days: 7.0

run:                             # pipeline_meme_4phase.py 的公共参数
  retrieve_topk: 50
  memory_token_limit: 512
  answer_concurrency: 20
  show_memory_time: true
  hybrid:
    enabled: false
    dense_weight: 0.8
    bm25_weight: 0.2
    pool_mult: 4

evaluate:
  judge_max_concurrency: 8
  judge_max_new_tokens: 512

parallel:
  extract_chunk_concurrency: 100
  ingest_relation_concurrency: 50    # relation_decision：单 episode 内关系对并发
  evermemos_cluster_concurrency: 8
  fuse_package_concurrency: 4
  parallel_episodes:                 # 各方法 4-phase per-episode 并发（relation_decision 包含融合，不宜过大）
    relation_decision: 100
    mem0: 4
    add_all: 100
    zep: 10
    amac: 10
    evermemos: 100

token_limits:
  extract_max_new_tokens: 2048
  ingest_relation_max_new_tokens: 256
  ingest_manager_max_new_tokens: 2048
  fusion_max_new_tokens: 512
  evaluate_max_new_tokens: 512       # MEME judge 输出较短，512 足够

prompts:
  relation_system_en: "lme_relation_classification_system_en_v2.jinja"
  relation_system_zh: "lme_relation_classification_system_zh_v2.jinja"
  relation_user: "lme_relation_classification_user.jinja"
  fusion_bundle_en: "fuse_memory_bundle_en_v3.jinja"
  fusion_bundle_zh: ""
  fusion_edge_labels_en: "fuse_memory_bundle_edge_labels_en_v2.jinja"
  fusion_edge_labels_zh: "fuse_memory_bundle_edge_labels_zh_v2.jinja"
  judge_oqa: ""
  judge_mcq: ""
  judge_system: ""
