# easy-mem LoCoMo 实验配置（默认模板）
# 用法：uv run --no-sync python run_exp_lme.py --config config/locomo_default.yaml [--stages extract,ingest,generate,evaluate]
#
# LoCoMo 与 LME 的主要区别：
#   - 每段双人对话 = 1 个 episode，含 19-32 个 session
#   - 保留真实姓名（不映射为 user/assistant）
#   - 抽取模板：Extract_Stage_LoCoMo.jinja（含证据追踪）
#   - RD 模板：RD_0_LoCoMo_relation_classify.jinja
#   - granularity: "all"（一个 session 一个 chunk）
#   - 对话格式：[dia_id] Speaker: text（含图片 caption）

experiment:
  benchmark: locomo             # LoCoMo 双人对话基准
  suffix: locomo_default        # 可读标签

# ---- 模型选择 ----
models:
  extract: gemma4-26B               # 候选记忆抽取
  manager: gemma4-26B               # 灌库管理（relation_decision 关系分类）
  answer: gemma4-26B                # 答题
  judge: qwen3-max                  # LLM Judge（云端 API）
  embedding: qwen3-embedding-0.6b   # Embedding（本地 vllm）

# ---- 候选记忆抽取 ----
extract:
  candidate_suffix: locomo_default  # 候选版本标签
  granularity: all                  # LoCoMo：一个 session 一个 chunk
  turn_overlap: 0
  language: en
  aspect_templates:
    - "Extract_Stage_LoCoMo.jinja"

# ---- 灌库方法 ----
methods:
  add_all:
    enabled: true

  relation_decision:
    enabled: true
    backend: llm
    related_top_k: 3
    fusion_model: ""
    fusion_enabled: true
    condition_sim_threshold: 0.5
    pairwise_sim_threshold: 0.5

  mem0:
    enabled: false

  evermemos:
    enabled: false

# ---- 答题生成 ----
generate:
  retrieve_topk: 50
  memory_token_limit: 1024           # LoCoMo 每 episode 记忆较多，适当放大
  answer_stratified_sample: 0
  answer_sample_seed: 43
  show_memory_time: true

  hybrid:
    enabled: false

# ---- 评估 ----
evaluate:
  use_cot: true

# ---- 可选：一次配置扫多个 token limit ----
sweep:
  memory_token_limits:
    - 1024

# ---- 可选：统计重复 ----
replication:
  count: 1
  scope: answer_judge

# ---- 并发控制 ----
parallel:
  extract_chunk_concurrency: 100
  ingest_relation_concurrency: 20
  ingest_episode_concurrency:
    relation_decision: 20
    mem0: 20
    add_all: 100
    evermemos: 20
    fusion_episodes: 100
    fusion_packages: 10
  generate_parallel_episodes: 10     # LoCoMo 只有 10 个 episode
  generate_answer_concurrency: 2
  evaluate_max_concurrency: 8

# ---- Token 限制 ----
token_limits:
  extract_max_new_tokens: 4096       # LoCoMo 输出可能较多（含 evidence）
  ingest_relation_max_new_tokens: 256
  ingest_manager_max_new_tokens: 2048
  fusion_max_new_tokens: 512
  evaluate_max_new_tokens: 512

# ---- 提示模板 ----
prompts:
  relation_user_en: RD_0_LoCoMo_relation_classify.jinja
  relation_user_zh: RD_0_LoCoMo_relation_classify.jinja
  judge_template: pipeline_judge.jinja
